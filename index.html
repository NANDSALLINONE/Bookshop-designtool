<meta name="theme-color" content="#f50f87">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d22;--ac:#f50f87;--tl:#054a5a;--bd:#d9dce3}
@media(prefers-color-scheme:dark){:root{--bg:#16171b;--card:#222429;--tx:#eceef2;--bd:#3a3d45}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.ui{max-width:1200px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
input,select,button,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:12px;gap:2px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
nav button.on{background:var(--ac);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:3px;text-align:left}td input{width:100%}
#login{max-width:320px;margin:15vh auto}#login input{width:100%;margin-bottom:8px}
.pages{background:#888;padding:10px;overflow:auto}
.page{background:#fff;position:relative;margin:0 auto 10px;box-shadow:0 2px 8px #0006;overflow:hidden}
.stk{position:absolute;display:flex;flex-direction:column;justify-content:center;overflow:hidden;color:#000}
.stk .t{position:relative;z-index:1}.ln{white-space:nowrap;line-height:1.25;overflow:hidden}
.stk img{position:absolute;top:50%;transform:translateY(-50%);object-fit:contain}
.hide{display:none!important}.shp *{vector-effect:non-scaling-stroke}
@media print{body{background:#fff}nav,.card{display:none!important}.ui{padding:0;max-width:none}.pages{padding:0;background:none}.page{margin:0;box-shadow:none;page-break-after:always}}

/* ===== LOGO + ANIMATION ===== */
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
background:radial-gradient(40% 40% at 20% 25%,#f50f8722,transparent 70%),radial-gradient(35% 35% at 80% 75%,#054a5a2e,transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
#login{text-align:center;position:relative}
#login h3{margin:4px 0 14px;animation:rise .5s .55s both}
#login input,#login button,#login p{animation:rise .45s both}
#login input:nth-of-type(1){animation-delay:.65s}#login input:nth-of-type(2){animation-delay:.72s}
#login button{animation-delay:.8s}
#login .lg{display:block;height:130px;margin:-6px auto 0;animation:logoIn .9s cubic-bezier(.2,1.3,.4,1) both,bob 4s 1.2s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0003)}
@keyframes logoIn{from{opacity:0;transform:translateY(-40px) scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#login.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#login.out{animation:out .35s both}
@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.96)}}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
input,select,button,textarea,.card{transition:border-color .2s,box-shadow .2s,transform .15s,background .2s}
button:hover{transform:translateY(-1px);box-shadow:0 3px 8px #0002}button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--tl);outline-offset:2px}
#app:not(.hide){animation:fade .5s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{height:52px;animation:logoIn .8s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 3px 5px #0003);transition:transform .4s}
.brand img:hover{transform:rotate(-6deg) scale(1.08)}
.brand b{font-size:18px;display:block}.brand small{opacity:.6}
section:not(.hide){animation:fade .25s both}
.page{animation:pageIn .45s both}.page:nth-child(2){animation-delay:.08s}.page:nth-child(3){animation-delay:.16s}.page:nth-child(n+4){animation-delay:.24s}
@keyframes pageIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
nav button{transition:background .2s,color .2s,transform .15s}
tr{animation:fade .3s both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{body::before{display:none}.brand{display:none}.page{animation:none}}

/* ===== LANGUAGE ===== */
body.si .card,body.si nav,body.si .brand,body.si .lm{font-family:'Noto Sans Sinhala',system-ui,sans-serif}
body.si label{font-size:12.5px}
.lt{margin-left:auto;display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--bd)}
.lt button,.lsw button{border:0;border-radius:999px;padding:4px 10px;background:none;font-size:12px}
.lt button.on,.lsw button.on{background:var(--ac);color:#fff}
.lsw{display:flex;gap:4px;justify-content:center;margin-top:10px}
.lsw button{border:1px solid var(--bd)}
.lm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0008;backdrop-filter:blur(6px);animation:fade .25s both;padding:16px}
.lbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 20px 50px #0006}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
.lbox img{height:90px;filter:drop-shadow(0 4px 6px #0003)}
.lbox h3{margin:8px 0 2px;font-family:'Noto Sans Sinhala',system-ui,sans-serif}
.lbox p{margin:0 0 16px;opacity:.65;font-size:13px}
.lbox .lo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbox .lo button{padding:16px 8px;font-size:18px;border-radius:12px;border:2px solid var(--bd);font-family:'Noto Sans Sinhala',system-ui,sans-serif;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,transform .15s,background .2s}
.lbox .lo button small{font-size:11px;opacity:.6}
.lbox .lo button:hover,.lbox .lo button:focus-visible{border-color:var(--ac);transform:translateY(-3px)}
.lbox .lo button.on{border-color:var(--ac);background:#f50f8714}
@media print{.lm,.lt{display:none!important}}

var has=Object.prototype.hasOwnProperty,lang='en',store=new WeakMap(),pending=0;
var obs=new MutationObserver(function(){if(!pending)pending=requestAnimationFrame(function(){pending=0;scan()})});
function skip(n){var p=n.parentNode;return !p||(p.closest&&p.closest('[data-x],script,style,.pages'))}
function tx(n){
  if(skip(n))return;
  var s=store.get(n);
  if(s&&n.data!==s.t){store.delete(n);s=null}
  if(s){n.data=lang==='si'?s.t:s.o;if(lang!=='si')store.delete(n);return}
  if(lang!=='si')return;
  var k=n.data.trim();if(!k||!has.call(D,k))return;
  var o=n.data,t=o.replace(k,D[k]);store.set(n,{o:o,t:t});n.data=t;
}
function scan(){
  obs.disconnect();
  try{
    var i,e,os=document.querySelectorAll('option:not([value])');   /* keep option values stable (app.js reads them) */
    for(i=0;i<os.length;i++)os[i].setAttribute('value',os[i].textContent.trim());
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),ns=[],n;
    while(n=w.nextNode())ns.push(n);
    for(i=0;i<ns.length;i++)tx(ns[i]);
    var ph=document.querySelectorAll('[placeholder]');
    for(i=0;i<ph.length;i++){e=ph[i];if(e.closest('[data-x]'))continue;var o=e.getAttribute('data-ph0');if(o===null){o=e.getAttribute('placeholder');e.setAttribute('data-ph0',o)}
      e.setAttribute('placeholder',lang==='si'&&has.call(D,o)?D[o]:o)}
  }finally{obs.observe(document.body,{childList:true,subtree:true,characterData:true})}
}
function setLang(l){
  lang=l;document.body.classList.toggle('si',l==='si');document.documentElement.lang=l;
  [].forEach.call(document.querySelectorAll('[data-l]'),function(b){b.classList.toggle('on',b.dataset.l===l)});
  try{localStorage.setItem('ns_lang',l)}catch(e){}
  scan();
}
var lm=document.getElementById('lm'),app=document.getElementById('app');
function openLm(){
  document.getElementById('lmlogo').src=document.querySelector('.brand img').src;
  lm.classList.remove('hide');var b=lm.querySelector('[data-l="'+lang+'"]');b&&b.focus();
}
function closeLm(){lm.classList.add('hide')}
document.addEventListener('click',function(ev){
  var b=ev.target.closest&&ev.target.closest('[data-l]');if(!b)return;
  setLang(b.dataset.l);
  if(lm.contains(b))closeLm();
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!lm.classList.contains('hide'))closeLm()});
/* ask every time the app screen is shown after login */
var shown=false;
function check(){var vis=!app.classList.contains('hide');if(vis&&!shown)openLm();shown=vis}
new MutationObserver(check).observe(app,{attributes:true,attributeFilter:['class']});
var saved='en';try{saved=localStorage.getItem('ns_lang')||'en'}catch(e){}
setLang(saved);check();
})();
